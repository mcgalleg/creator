<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="psi-star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#FBBF24"/>
    </linearGradient>
    <radialGradient id="psi-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FBBF24;stop-opacity:0.25"/>
      <stop offset="50%" style="stop-color:#F59E0B;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="40" fill="#0F172A"/>

  <g transform="translate(100,100)">
    <!-- Glow -->
    <circle cx="0" cy="0" r="70" fill="url(#psi-glow)"/>

    <!-- Radiating lines -->
    <line x1="0" y1="-22" x2="0" y2="-62" stroke="#93C5FD" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round"/>
    <line x1="0" y1="22" x2="0" y2="62" stroke="#93C5FD" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round"/>
    <line x1="-22" y1="0" x2="-62" y2="0" stroke="#93C5FD" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round"/>
    <line x1="22" y1="0" x2="62" y2="0" stroke="#93C5FD" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round"/>
    <line x1="-16" y1="-16" x2="-44" y2="-44" stroke="#93C5FD" stroke-width="1" stroke-opacity="0.18" stroke-linecap="round"/>
    <line x1="16" y1="-16" x2="44" y2="-44" stroke="#93C5FD" stroke-width="1" stroke-opacity="0.18" stroke-linecap="round"/>
    <line x1="-16" y1="16" x2="-44" y2="44" stroke="#93C5FD" stroke-width="1" stroke-opacity="0.18" stroke-linecap="round"/>
    <line x1="16" y1="16" x2="44" y2="44" stroke="#93C5FD" stroke-width="1" stroke-opacity="0.18" stroke-linecap="round"/>

    <!-- Endpoint dots -->
    <circle cx="0" cy="-62" r="3" fill="#60A5FA" opacity="0.55"/>
    <circle cx="0" cy="62" r="3" fill="#60A5FA" opacity="0.55"/>
    <circle cx="-62" cy="0" r="3" fill="#60A5FA" opacity="0.55"/>
    <circle cx="62" cy="0" r="3" fill="#60A5FA" opacity="0.55"/>
    <circle cx="-44" cy="-44" r="2" fill="#60A5FA" opacity="0.35"/>
    <circle cx="44" cy="-44" r="2" fill="#60A5FA" opacity="0.35"/>
    <circle cx="-44" cy="44" r="2" fill="#60A5FA" opacity="0.35"/>
    <circle cx="44" cy="44" r="2" fill="#60A5FA" opacity="0.35"/>

    <!-- 4-pointed star -->
    <polygon points="0,-28 6,-6 28,0 6,6 0,28 -6,6 -28,0 -6,-6" fill="url(#psi-star-grad)"/>

    <!-- Bright center -->
    <circle cx="0" cy="0" r="5" fill="#FEF3C7"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
  </g>
</svg>