<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="500" height="160" role="img" aria-labelledby="c1-title c1-desc">
  <title id="c1-title">Astriq Logo</title>
  <desc id="c1-desc">Astriq stellar wordmark with star sparkle above the letter I</desc>
  <defs>
    <radialGradient id="c1-bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="c1-txt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="35%" stop-color="#F1F5F9"/>
      <stop offset="65%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="c1-star" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="c1-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="160" fill="url(#c1-bg)"/>

  <!-- Ambient constellation dots -->
  <g opacity="0.35">
    <circle cx="42" cy="28" r="1" fill="#475569"/>
    <circle cx="458" cy="30" r="1.1" fill="#475569"/>
    <circle cx="88" cy="138" r="0.8" fill="#475569"/>
    <circle cx="412" cy="135" r="0.7" fill="#475569"/>
    <circle cx="165" cy="20" r="0.6" fill="#475569"/>
    <circle cx="355" cy="16" r="0.7" fill="#475569"/>
    <circle cx="28" cy="82" r="0.5" fill="#475569"/>
    <circle cx="472" cy="88" r="0.5" fill="#475569"/>
    <circle cx="220" cy="145" r="0.5" fill="#475569"/>
    <circle cx="310" cy="148" r="0.6" fill="#475569"/>
  </g>

  <!-- Faint constellation lines -->
  <g stroke="#334155" stroke-width="0.3" opacity="0.08">
    <line x1="42" y1="28" x2="165" y2="20"/>
    <line x1="355" y1="16" x2="458" y2="30"/>
    <line x1="88" y1="138" x2="220" y2="145"/>
    <line x1="310" y1="148" x2="412" y2="135"/>
  </g>

  <!-- Wordmark: ASTRIQ -->
  <text x="250" y="92" text-anchor="middle"
        font-family="Inter, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="52" font-weight="300" letter-spacing="14"
        fill="url(#c1-txt)">ASTRIQ</text>

  <!-- Star glow layer -->
  <path d="M308,34 L311,44 L321,47 L311,50 L308,60 L305,50 L295,47 L305,44 Z"
        fill="#F59E0B" opacity="0.4" filter="url(#c1-glow)"/>
  <!-- Star sparkle above I -->
  <path d="M308,34 L311,44 L321,47 L311,50 L308,60 L305,50 L295,47 L305,44 Z"
        fill="url(#c1-star)"/>
  <!-- Secondary twinkle -->
  <path d="M322,38 L323,41.5 L326.5,42.5 L323,43.5 L322,47 L321,43.5 L317.5,42.5 L321,41.5 Z"
        fill="#FDE68A" opacity="0.4"/>

  <!-- Tagline -->
  <text x="250" y="122" text-anchor="middle"
        font-family="Inter, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="9" font-weight="400" letter-spacing="5"
        fill="#475569">STAR INTELLIGENCE</text>
</svg>
