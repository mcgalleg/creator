<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140">
  <defs>
    <linearGradient id="ar-ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#818CF8;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="ar-star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#FBBF24"/>
    </linearGradient>
    <radialGradient id="ar-center-glow" cx="50%" cy="35%" r="50%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Icon centered at 70,70 -->
  <g transform="translate(70,70)">
    <!-- Outer orbit ring -->
    <ellipse cx="0" cy="0" rx="42" ry="42" fill="none" stroke="url(#ar-ring-grad)" stroke-width="1.5"/>

    <!-- Inner orbit ring (tilted feel via ellipse) -->
    <ellipse cx="0" cy="0" rx="28" ry="28" fill="none" stroke="#60A5FA" stroke-width="0.8" stroke-opacity="0.25"/>

    <!-- Center glow -->
    <circle cx="0" cy="0" r="30" fill="url(#ar-center-glow)"/>

    <!-- Orbital data dots on outer ring -->
    <circle cx="0" cy="-42" r="2.5" fill="#93C5FD" opacity="0.6"/>
    <circle cx="30" cy="-30" r="2" fill="#93C5FD" opacity="0.45"/>
    <circle cx="42" cy="0" r="2.5" fill="#93C5FD" opacity="0.6"/>
    <circle cx="30" cy="30" r="2" fill="#93C5FD" opacity="0.45"/>
    <circle cx="0" cy="42" r="2.5" fill="#93C5FD" opacity="0.6"/>
    <circle cx="-30" cy="30" r="2" fill="#93C5FD" opacity="0.45"/>
    <circle cx="-42" cy="0" r="2.5" fill="#93C5FD" opacity="0.6"/>
    <circle cx="-30" cy="-30" r="2" fill="#93C5FD" opacity="0.45"/>

    <!-- Orbital data dots on inner ring -->
    <circle cx="20" cy="-20" r="1.5" fill="#60A5FA" opacity="0.4"/>
    <circle cx="28" cy="0" r="1.5" fill="#60A5FA" opacity="0.4"/>
    <circle cx="-20" cy="20" r="1.5" fill="#60A5FA" opacity="0.4"/>
    <circle cx="-28" cy="0" r="1.5" fill="#60A5FA" opacity="0.4"/>

    <!-- Faint connecting lines between rings -->
    <line x1="0" y1="-42" x2="0" y2="-28" stroke="#93C5FD" stroke-width="0.5" stroke-opacity="0.2"/>
    <line x1="42" y1="0" x2="28" y2="0" stroke="#93C5FD" stroke-width="0.5" stroke-opacity="0.2"/>
    <line x1="0" y1="42" x2="0" y2="28" stroke="#93C5FD" stroke-width="0.5" stroke-opacity="0.2"/>
    <line x1="-42" y1="0" x2="-28" y2="0" stroke="#93C5FD" stroke-width="0.5" stroke-opacity="0.2"/>

    <!-- Focal star — slightly off-center top for North Star feel -->
    <circle cx="0" cy="-8" r="8" fill="url(#ar-star-grad)"/>
    <circle cx="0" cy="-8" r="3.5" fill="#FEF3C7"/>
    <!-- Sparkle on star -->
    <polygon points="0,-14 1,-9 6,-8 1,-7 0,-2 -1,-7 -6,-8 -1,-9" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(148, 82)">
    <text font-family="'Inter','SF Pro Display','Helvetica Neue',system-ui,sans-serif" font-size="42" font-weight="200" letter-spacing="10" fill="#F1F5F9">ASTRIQ</text>
  </g>
</svg>