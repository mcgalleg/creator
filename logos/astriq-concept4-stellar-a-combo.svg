<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" width="480" height="140" role="img" aria-labelledby="c4c-title">
  <title id="c4c-title">Astriq - Stellar A Combination Mark</title>
  <defs>
    <radialGradient id="c4c-bg" cx="15%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="c4c-leg" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="65%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="c4c-star" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="c4c-txt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="c4c-sg" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="c4c-lg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="140" fill="url(#c4c-bg)"/>

  <!-- A Lettermark Icon -->
  <g transform="translate(68, 72) scale(0.5)">
    <!-- Leg glow -->
    <g opacity="0.15" filter="url(#c4c-lg)">
      <line x1="-50" y1="65" x2="-12" y2="-48" stroke="#818CF8" stroke-width="12" stroke-linecap="round"/>
      <line x1="50" y1="65" x2="12" y2="-48" stroke="#818CF8" stroke-width="12" stroke-linecap="round"/>
    </g>
    <!-- A legs and crossbar -->
    <g stroke="url(#c4c-leg)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="-50" y1="65" x2="-12" y2="-48"/>
      <line x1="50" y1="65" x2="12" y2="-48"/>
      <line x1="-33" y1="18" x2="33" y2="18"/>
    </g>
    <!-- Star glow -->
    <path d="M0,-76 L3.5,-64 L16,-60 L3.5,-56 L0,-44 L-3.5,-56 L-16,-60 L-3.5,-64 Z"
          fill="#F59E0B" opacity="0.35" filter="url(#c4c-sg)"/>
    <!-- Star -->
    <path d="M0,-76 L3.5,-64 L16,-60 L3.5,-56 L0,-44 L-3.5,-56 L-16,-60 L-3.5,-64 Z"
          fill="url(#c4c-star)"/>
    <!-- Twinkle -->
    <path d="M19,-70 L20,-66.5 L23.5,-65.5 L20,-64.5 L19,-61 L18,-64.5 L14.5,-65.5 L18,-66.5 Z"
          fill="#FDE68A" opacity="0.4"/>
  </g>

  <!-- Divider -->
  <line x1="130" y1="32" x2="130" y2="108" stroke="#1E293B" stroke-width="1" opacity="0.4"/>

  <!-- Wordmark -->
  <text x="305" y="76" text-anchor="middle"
        font-family="Inter, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="40" font-weight="400" letter-spacing="5"
        fill="url(#c4c-txt)">Astriq</text>

  <!-- Subtitle -->
  <text x="305" y="98" text-anchor="middle"
        font-family="Inter, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="8.5" font-weight="300" letter-spacing="4"
        fill="#475569">STAR INTELLIGENCE</text>
</svg>
