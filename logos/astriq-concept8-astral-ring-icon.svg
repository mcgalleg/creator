<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="ari-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#818CF8;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="ari-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#FBBF24"/>
    </linearGradient>
    <radialGradient id="ari-glow" cx="50%" cy="42%" r="50%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" rx="40" fill="#0F172A"/>

  <g transform="translate(100,100)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="url(#ari-ring)" stroke-width="2"/>

    <!-- Inner ring -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#60A5FA" stroke-width="1" stroke-opacity="0.25"/>

    <!-- Center glow -->
    <circle cx="0" cy="0" r="45" fill="url(#ari-glow)"/>

    <!-- Outer ring data dots -->
    <circle cx="0" cy="-62" r="3.5" fill="#93C5FD" opacity="0.6"/>
    <circle cx="44" cy="-44" r="2.5" fill="#93C5FD" opacity="0.45"/>
    <circle cx="62" cy="0" r="3.5" fill="#93C5FD" opacity="0.6"/>
    <circle cx="44" cy="44" r="2.5" fill="#93C5FD" opacity="0.45"/>
    <circle cx="0" cy="62" r="3.5" fill="#93C5FD" opacity="0.6"/>
    <circle cx="-44" cy="44" r="2.5" fill="#93C5FD" opacity="0.45"/>
    <circle cx="-62" cy="0" r="3.5" fill="#93C5FD" opacity="0.6"/>
    <circle cx="-44" cy="-44" r="2.5" fill="#93C5FD" opacity="0.45"/>

    <!-- Inner ring data dots -->
    <circle cx="28" cy="-28" r="2" fill="#60A5FA" opacity="0.4"/>
    <circle cx="40" cy="0" r="2" fill="#60A5FA" opacity="0.4"/>
    <circle cx="0" cy="40" r="2" fill="#60A5FA" opacity="0.4"/>
    <circle cx="-28" cy="28" r="2" fill="#60A5FA" opacity="0.4"/>
    <circle cx="-40" cy="0" r="2" fill="#60A5FA" opacity="0.4"/>
    <circle cx="0" cy="-40" r="2" fill="#60A5FA" opacity="0.4"/>

    <!-- Connecting spokes -->
    <line x1="0" y1="-62" x2="0" y2="-40" stroke="#93C5FD" stroke-width="0.7" stroke-opacity="0.2"/>
    <line x1="62" y1="0" x2="40" y2="0" stroke="#93C5FD" stroke-width="0.7" stroke-opacity="0.2"/>
    <line x1="0" y1="62" x2="0" y2="40" stroke="#93C5FD" stroke-width="0.7" stroke-opacity="0.2"/>
    <line x1="-62" y1="0" x2="-40" y2="0" stroke="#93C5FD" stroke-width="0.7" stroke-opacity="0.2"/>
    <line x1="44" y1="-44" x2="28" y2="-28" stroke="#93C5FD" stroke-width="0.5" stroke-opacity="0.15"/>
    <line x1="-44" y1="44" x2="-28" y2="28" stroke="#93C5FD" stroke-width="0.5" stroke-opacity="0.15"/>

    <!-- Focal star -->
    <circle cx="0" cy="-10" r="12" fill="url(#ari-star)"/>
    <circle cx="0" cy="-10" r="5" fill="#FEF3C7"/>
    <polygon points="0,-19 1.5,-11.5 9,-10 1.5,-8.5 0,-1 -1.5,-8.5 -9,-10 -1.5,-11.5" fill="#FFFFFF" opacity="0.5"/>
  </g>
</svg>