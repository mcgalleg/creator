<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="sfi-iris" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#818CF8"/>
    </linearGradient>
    <linearGradient id="sfi-pupil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#FBBF24"/>
    </linearGradient>
    <radialGradient id="sfi-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" rx="40" fill="#0F172A"/>

  <g transform="translate(100,100)">
    <!-- Outer eye arcs -->
    <path d="M-62,0 Q-38,-48 0,-54 Q38,-48 62,0" fill="none" stroke="#60A5FA" stroke-width="1.2" stroke-opacity="0.35"/>
    <path d="M-62,0 Q-38,48 0,54 Q38,48 62,0" fill="none" stroke="#60A5FA" stroke-width="1.2" stroke-opacity="0.35"/>

    <!-- Outer constellation dots -->
    <circle cx="-62" cy="0" r="3" fill="#93C5FD" opacity="0.6"/>
    <circle cx="-44" cy="-32" r="2.5" fill="#93C5FD" opacity="0.5"/>
    <circle cx="-22" cy="-48" r="2.5" fill="#93C5FD" opacity="0.5"/>
    <circle cx="0" cy="-54" r="3" fill="#93C5FD" opacity="0.6"/>
    <circle cx="22" cy="-48" r="2.5" fill="#93C5FD" opacity="0.5"/>
    <circle cx="44" cy="-32" r="2.5" fill="#93C5FD" opacity="0.5"/>
    <circle cx="62" cy="0" r="3" fill="#93C5FD" opacity="0.6"/>
    <circle cx="44" cy="32" r="2.5" fill="#93C5FD" opacity="0.5"/>
    <circle cx="22" cy="48" r="2.5" fill="#93C5FD" opacity="0.5"/>
    <circle cx="0" cy="54" r="3" fill="#93C5FD" opacity="0.6"/>
    <circle cx="-22" cy="48" r="2.5" fill="#93C5FD" opacity="0.5"/>
    <circle cx="-44" cy="32" r="2.5" fill="#93C5FD" opacity="0.5"/>

    <!-- Inner iris ring -->
    <circle cx="0" cy="0" r="26" fill="none" stroke="url(#sfi-iris)" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- Cross connections -->
    <line x1="-62" y1="0" x2="-26" y2="0" stroke="#60A5FA" stroke-width="0.7" stroke-opacity="0.2"/>
    <line x1="62" y1="0" x2="26" y2="0" stroke="#60A5FA" stroke-width="0.7" stroke-opacity="0.2"/>
    <line x1="0" y1="-54" x2="0" y2="-26" stroke="#60A5FA" stroke-width="0.7" stroke-opacity="0.2"/>
    <line x1="0" y1="54" x2="0" y2="26" stroke="#60A5FA" stroke-width="0.7" stroke-opacity="0.2"/>
    <line x1="-44" y1="-32" x2="-18" y2="-18" stroke="#60A5FA" stroke-width="0.5" stroke-opacity="0.15"/>
    <line x1="44" y1="-32" x2="18" y2="-18" stroke="#60A5FA" stroke-width="0.5" stroke-opacity="0.15"/>
    <line x1="-44" y1="32" x2="-18" y2="18" stroke="#60A5FA" stroke-width="0.5" stroke-opacity="0.15"/>
    <line x1="44" y1="32" x2="18" y2="18" stroke="#60A5FA" stroke-width="0.5" stroke-opacity="0.15"/>

    <!-- Inner glow -->
    <circle cx="0" cy="0" r="24" fill="url(#sfi-glow)"/>

    <!-- Iris dots -->
    <circle cx="0" cy="-26" r="3" fill="#60A5FA" opacity="0.7"/>
    <circle cx="26" cy="0" r="3" fill="#60A5FA" opacity="0.7"/>
    <circle cx="0" cy="26" r="3" fill="#60A5FA" opacity="0.7"/>
    <circle cx="-26" cy="0" r="3" fill="#60A5FA" opacity="0.7"/>
    <circle cx="18" cy="-18" r="2" fill="#60A5FA" opacity="0.5"/>
    <circle cx="18" cy="18" r="2" fill="#60A5FA" opacity="0.5"/>
    <circle cx="-18" cy="-18" r="2" fill="#60A5FA" opacity="0.5"/>
    <circle cx="-18" cy="18" r="2" fill="#60A5FA" opacity="0.5"/>

    <!-- Pupil -->
    <circle cx="0" cy="0" r="9" fill="url(#sfi-pupil)"/>
    <circle cx="0" cy="0" r="4" fill="#FEF3C7"/>
    <polygon points="0,-6 1.2,-1.2 6,0 1.2,1.2 0,6 -1.2,1.2 -6,0 -1.2,-1.2" fill="#FFFFFF" opacity="0.7"/>
  </g>
</svg>