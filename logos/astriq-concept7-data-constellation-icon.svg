<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="dci-leg" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#A78BFA"/>
    </linearGradient>
    <linearGradient id="dci-apex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#FBBF24"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="40" fill="#0F172A"/>

  <g transform="translate(100,105)">
    <!-- Left leg -->
    <line x1="0" y1="-60" x2="-18" y2="-27" stroke="url(#dci-leg)" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="-18" y1="-27" x2="-33" y2="3" stroke="url(#dci-leg)" stroke-width="1.5" stroke-opacity="0.45"/>
    <line x1="-33" y1="3" x2="-45" y2="27" stroke="url(#dci-leg)" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="-45" y1="27" x2="-56" y2="55" stroke="url(#dci-leg)" stroke-width="1.5" stroke-opacity="0.35"/>

    <!-- Right leg -->
    <line x1="0" y1="-60" x2="18" y2="-27" stroke="url(#dci-leg)" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="18" y1="-27" x2="33" y2="3" stroke="url(#dci-leg)" stroke-width="1.5" stroke-opacity="0.45"/>
    <line x1="33" y1="3" x2="45" y2="27" stroke="url(#dci-leg)" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="45" y1="27" x2="56" y2="55" stroke="url(#dci-leg)" stroke-width="1.5" stroke-opacity="0.35"/>

    <!-- Crossbar -->
    <line x1="-33" y1="3" x2="-12" y2="3" stroke="#60A5FA" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="-12" y1="3" x2="12" y2="3" stroke="#60A5FA" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="12" y1="3" x2="33" y2="3" stroke="#60A5FA" stroke-width="1.2" stroke-opacity="0.4"/>

    <!-- Ghost connections -->
    <line x1="-18" y1="-27" x2="18" y2="-27" stroke="#818CF8" stroke-width="0.6" stroke-opacity="0.15"/>
    <line x1="-45" y1="27" x2="45" y2="27" stroke="#818CF8" stroke-width="0.6" stroke-opacity="0.12"/>

    <!-- Apex gold star -->
    <circle cx="0" cy="-60" r="7" fill="url(#dci-apex)"/>
    <circle cx="0" cy="-60" r="3" fill="#FEF3C7"/>

    <!-- Left leg nodes -->
    <circle cx="-18" cy="-27" r="4" fill="#60A5FA" opacity="0.7"/>
    <circle cx="-33" cy="3" r="5" fill="#60A5FA" opacity="0.8"/>
    <circle cx="-45" cy="27" r="3.5" fill="#60A5FA" opacity="0.6"/>
    <circle cx="-56" cy="55" r="4" fill="#60A5FA" opacity="0.7"/>

    <!-- Right leg nodes -->
    <circle cx="18" cy="-27" r="4" fill="#60A5FA" opacity="0.7"/>
    <circle cx="33" cy="3" r="5" fill="#60A5FA" opacity="0.8"/>
    <circle cx="45" cy="27" r="3.5" fill="#60A5FA" opacity="0.6"/>
    <circle cx="56" cy="55" r="4" fill="#60A5FA" opacity="0.7"/>

    <!-- Crossbar midpoints -->
    <circle cx="-12" cy="3" r="2.5" fill="#93C5FD" opacity="0.5"/>
    <circle cx="12" cy="3" r="2.5" fill="#93C5FD" opacity="0.5"/>
  </g>
</svg>